name: Build release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching pyproject.toml
        required: true
        default: v0.1.0
      publish:
        description: Publish tested artifacts to PyPI (requires the pypi environment)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match package version'
          tagged = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + os.environ['RELEASE_TAG'] + '^{commit}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert tagged == head
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('commit=' + head + '\n')
          PY
  wheels:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: pypa/cibuildwheel@a499b5be1894c8ad8a44e11c289559cdc24fd32a # v4.3.1
        env:
          CIBW_BUILD: 'cp310-* cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: 'SCI_REQUIRE_NATIVE=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1'
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -c "from sci_solver.solvers.collision_search import COLLISION_BACKEND; assert COLLISION_BACKEND == 'native'"
            && python -m pytest {project}/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  source:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=77.0.3' wheel
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - run: python -m pip install dist/*.tar.gz pytest
        env:
          SCI_REQUIRE_NATIVE: '1'
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-source
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sci-solver/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
