name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      SCI_REQUIRE_NATIVE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -c "from sci_solver.solvers.collision_search import COLLISION_BACKEND; assert COLLISION_BACKEND == 'native'"
      - run: python -m pytest -q
      - run: ruff check .
      - run: python examples/two_robots.py
      - run: python examples/fleet.py
  python-fallback:
    runs-on: ubuntu-latest
    env:
      SCI_NO_NATIVE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: python -c "from sci_solver.solvers.collision_search import COLLISION_BACKEND; assert COLLISION_BACKEND == 'python'"
      - run: python -m pytest -q
  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      SCI_REQUIRE_NATIVE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - run: python -m pip install '.[dev]' 'numpy==1.23.0' 'scipy==1.10.0'
      - run: python -m pytest -q
