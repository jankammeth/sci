[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-solver"
version = "0.2.0"
description = "Sequential Contact Insertion for continuous-time robot fleet planning."
readme = "README.md"
authors = [{ name = "Jan Kamm" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/jankammeth/sci"
Repository = "https://github.com/jankammeth/sci"
Documentation = "https://github.com/jankammeth/sci/tree/main/docs"
Issues = "https://github.com/jankammeth/sci/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sci-solve = "sci_solver.cli.vector_sci:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sci_solver*"]

[tool.setuptools.package-data]
"sci_solver.solvers" = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# These are reference numerical sources; preserve their provenance verbatim.
[tool.ruff.lint.per-file-ignores]
"src/sci_solver/solvers/*.py" = ["E741"]
